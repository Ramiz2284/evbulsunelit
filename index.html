<!DOCTYPE html>
<html class="scroll-smooth" lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="EvBulsun — найди жильё на своих условиях. Разместите запрос и получайте предложения напрямую от владельцев." />
  <title>EvBulsun | Премиальная недвижимость</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#C5A059",
            "background-light": "#FDFCFB",
            "background-dark": "#0A0C10",
            navy: {
              800: "#1A202C",
              900: "#0F172A",
              950: "#020617",
            }
          },
          fontFamily: {
            display: ["Playfair Display", "serif"],
            sans: ["Inter", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.5rem",
            'xl': '1rem',
            '2xl': '1.5rem',
          },
        },
      },
    };
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
        .glass {
          background: rgba(255, 255, 255, 0.03);
          backdrop-filter: blur(12px);
          border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .hero-gradient {
          background: linear-gradient(to bottom, rgba(2, 6, 23, 0.6), rgba(2, 6, 23, 0.95)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=2000');
          background-size: cover;
          background-position: center;
        }
        .gold-shimmer {
          background: linear-gradient(45deg, #C5A059 25%, #E2C27D 50%, #C5A059 75%);
          background-size: 200% auto;
          transition: 0.5s;
        }
        .gold-shimmer:hover {
          background-position: right center;
        }
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }
    </style>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>

<body class="bg-background-light dark:bg-background-dark text-navy-950 dark:text-gray-100 font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
